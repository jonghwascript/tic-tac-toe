<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color"
    content="#1a2a33" />
  <link rel="icon"
    type="image/png"
    sizes="32x32"
    href="./images/favicon-32x32.png" />
  <link rel="stylesheet"
    href="./css/style.css" />
  <title>Frontend Mentor | Tic Tac Toe</title>
</head>

<body class="l-cover">
  <button class="c-button c-button--primary"
    type="button">
    New Game (vs CPU)
  </button>
  <button class="c-button c-button--secondary"
    type="button">
    New Game (vs player)
  </button>
  <button class="c-button c-button--medium"
    type="button">Next round
  </button>
  <button class="c-button c-button--small"
    type="button">quit
  </button>
  <button class="c-button c-button--icon"
    type="button">
    <svg width="20"
      height="20"
      xmlns="http://www.w3.org/2000/svg">
      <path
        d="M19.524 0h-1.88a.476.476 0 0 0-.476.499l.159 3.284A9.81 9.81 0 0 0 9.835.317C4.415.317-.004 4.743 0 10.167.004 15.597 4.406 20 9.835 20a9.796 9.796 0 0 0 6.59-2.536.476.476 0 0 0 .019-.692l-1.348-1.349a.476.476 0 0 0-.65-.022 6.976 6.976 0 0 1-9.85-.63 6.987 6.987 0 0 1 .63-9.857 6.976 6.976 0 0 1 10.403 1.348l-4.027-.193a.476.476 0 0 0-.498.476v1.881c0 .263.213.476.476.476h7.944A.476.476 0 0 0 20 8.426V.476A.476.476 0 0 0 19.524 0Z"
        fill="#1F3641" />
    </svg>
  </button>

  <div class="c-mark-picker l-cluster"
    data-gap="small"
    role="group"
    aria-labelledby="new-game-title">
    <button class="c-mark-picker__choice"
      type="button"
      aria-label="X"
      aria-pressed="false">
      <img src="./images/icon-x.svg"
        alt="" /></button><button class="c-mark-picker__choice is-selected"
      type="button"
      aria-label="O"
      aria-pressed="false">
      <img src="./images/icon-o.svg"
        alt="" />
    </button>
  </div>

  <div class="c-mark-picker l-cluster"
    data-gap="small"
    role="group"
    aria-labelledby="new-game-title">
    <label for="">
      <input type="radio"
        class="c-mark-picker__choice u-sr-only"
        name="mark"
        value="X" />
    </label>
    <label for="">
      <input type="radio"
        class="c-mark-picker__choice u-sr-only"
        name="mark"
        value="O" />
    </label>
  </div>
</body>

</html>
