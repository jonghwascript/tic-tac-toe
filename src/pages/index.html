<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color"
    content="#1a2a33" />
  <link rel="icon"
    type="image/png"
    sizes="32x32"
    href="./images/favicon-32x32.png" />
  <link rel="stylesheet"
    href="./css/style.css" />
  <title>Frontend Mentor | Tic Tac Toe</title>
</head>

<body>
  <a class="c-skip-link"
    href="#main-content">Skip to main content</a>
  <main class="l-cover"
    id="main-content">
    <div class="l-center c-container">
      <div class="c-app l-stack"
        data-space="large">
        <!-- New Game -->
        <section class="c-new-game l-stack"
          data-space="normal"
          aria-labelledby="new-game-title">
          @@include('./components/logo.html')
          <div class="c-new-game__header l-box l-stack">
            <h1 id="new-game-title">Pick player 1's mark</h1>
            <!-- chekck box -->
            <div class="c-mark-picker l-cluster l-box"
              data-gap="small"
              role="group"
              aria-labelledby="new-game-title">
              <label for="c-mark-picker__choice-x"
                class="c-mark-picker__choice">
                <input type="radio"
                  class="c-mark-picker__choice-input u-sr-only"
                  id="c-mark-picker__choice-x"
                  name="mark"
                  value="X" />
                <svg width="64"
                  height="64"
                  class="c-mark-picker__choice-icon"
                  xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M15.002 1.147 32 18.145 48.998 1.147a3 3 0 0 1 4.243 0l9.612 9.612a3 3 0 0 1 0 4.243L45.855 32l16.998 16.998a3 3 0 0 1 0 4.243l-9.612 9.612a3 3 0 0 1-4.243 0L32 45.855 15.002 62.853a3 3 0 0 1-4.243 0L1.147 53.24a3 3 0 0 1 0-4.243L18.145 32 1.147 15.002a3 3 0 0 1 0-4.243l9.612-9.612a3 3 0 0 1 4.243 0Z"
                    fill="currentColor"
                    fill-rule="evenodd" />
                </svg>
              </label>
              <label for="c-mark-picker__choice-o"
                class="c-mark-picker__choice">
                <input type="radio"
                  class="c-mark-picker__choice-input u-sr-only"
                  id="c-mark-picker__choice-o"
                  name="mark"
                  value="O"
                  checked />
                <svg width="64"
                  height="64"
                  class="c-mark-picker__choice-icon"
                  xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M32 0c17.673 0 32 14.327 32 32 0 17.673-14.327 32-32 32C14.327 64 0 49.673 0 32 0 14.327 14.327 0 32 0Zm0 18.963c-7.2 0-13.037 5.837-13.037 13.037 0 7.2 5.837 13.037 13.037 13.037 7.2 0 13.037-5.837 13.037-13.037 0-7.2-5.837-13.037-13.037-13.037Z"
                    fill="currentColor" />
                </svg>
              </label>
            </div>
            <p class="c-new-game__hint">Remember: X goes first</p>
          </div>
          <div class="c-new-game__actions l-stack"
            data-space="small">
            <button class="c-button c-button--secondary"
              type="button">
              New Game (vs player)
            </button>
            <button class="c-button c-button--primary"
              type="button">
              New Game (vs CPU)
            </button>
          </div>
        </section>
        <!-- Game Board -->
        <section class="c-game-board l-stack"
          aria-label="Game board">
          <header class="c-game-board__header l-cluster">
            @@include('./components/logo.html')
            <p class="c-turn-indicator l-with-icon">
              <svg viewBox="0 0 64 64"
                class="c-turn-indicator__icon l-icon"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M15.002 1.147 32 18.145 48.998 1.147a3 3 0 0 1 4.243 0l9.612 9.612a3 3 0 0 1 0 4.243L45.855 32l16.998 16.998a3 3 0 0 1 0 4.243l-9.612 9.612a3 3 0 0 1-4.243 0L32 45.855 15.002 62.853a3 3 0 0 1-4.243 0L1.147 53.24a3 3 0 0 1 0-4.243L18.145 32 1.147 15.002a3 3 0 0 1 0-4.243l9.612-9.612a3 3 0 0 1 4.243 0Z"
                  fill="currentColor"
                  fill-rule="evenodd" />
              </svg>
              <span class="c-turn-indicator__text">Turn</span>
            </p>
            <button class="c-button c-button--icon-restart"
              type="button">
              <svg width="20"
                height="20"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19.524 0h-1.88a.476.476 0 0 0-.476.499l.159 3.284A9.81 9.81 0 0 0 9.835.317C4.415.317-.004 4.743 0 10.167.004 15.597 4.406 20 9.835 20a9.796 9.796 0 0 0 6.59-2.536.476.476 0 0 0 .019-.692l-1.348-1.349a.476.476 0 0 0-.65-.022 6.976 6.976 0 0 1-9.85-.63 6.987 6.987 0 0 1 .63-9.857 6.976 6.976 0 0 1 10.403 1.348l-4.027-.193a.476.476 0 0 0-.498.476v1.881c0 .263.213.476.476.476h7.944A.476.476 0 0 0 20 8.426V.476A.476.476 0 0 0 19.524 0Z"
                  fill="#1F3641" />
              </svg>
            </button>
          </header>
          <div class="l-stack c-board-layout">
            <div class="c-board l-grid"
              role="grid"
              aria-label="Tic Tac Toe board">
              <button class="c-board__cell c-board__cell--o"
                type="button"
                role="gridcell"
                aria-label="Empty square 1">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 2">
              </button>
              <button class="c-board__cell c-board__cell--x"
                type="button"
                role="gridcell"
                aria-label="Empty square 3">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 4">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 5">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 6">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 7">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 8">
              </button>
              <button class="c-board__cell"
                type="button"
                role="gridcell"
                aria-label="Empty square 9">
              </button>
            </div>
            <section class="c-scores l-cluster"
              aria-label="Score">
              <div class="c-score l-stack c-score--x"
                data-space="small">
                <span class="c-score__label">X (You)</span>
                <output class="c-score__value">0</output>
              </div>
              <div class="c-score l-stack c-score--ties"
                data-space="small">
                <span class="c-score__label">Ties</span>
                <output class="c-score__value">0</output>
              </div>
              <div class="c-score l-stack c-score--o"
                data-space="small">
                <span class="c-score__label">O (CPU)</span>
                <output class="c-score__value">0</output>
              </div>
            </section>
          </div>
        </section>
        <!-- Dialog -->
        <dialog class="c-round-result"
          aria-live="assertive"
          close>
          <div class="c-round-result__layout l-stack">
            <p class="c-round-result__message">Oh no, you lost</p>
            <p class="c-round-result__message u-hidden">You won!</p>
            <p class="c-round-result__message u-hidden">Player 1 wins!</p>
            <div class="c-round-result__inner-layout l-stack">
              <p class="c-round-result__winner l-with-icon">
                <img class="l-icon c-round-result__icon"
                  src="./images/icon-o.svg"
                  alt="" />
                <span class="c-round-result__text">takes the round</span>
              </p>
              <p class="c-round-result__tie u-hidden">Round tied</p>
              <div class="c-round-result__actions l-cluster">
                <button class="c-button c-button--small"
                  type="button">Quit
                </button>
                <button class="c-button c-button--primary c-button--medium"
                  type="button">
                  Next round
                </button>
              </div>
            </div>
          </div>
        </dialog>
        <!-- Restart Dialog-->
        <dialog class="c-restart-dialog"
          aria-modal="true"
          aria-labelledby="restart-title"
          open>
          <div class="restart-dialog__layout l-stack">
            <h2 id="restart-title"
              class="c-restart-dialog__title">Restart game?</h2>
            <div class="c-restart-dialog__actions l-cluster"
              data-gap="small">
              <button class="c-button c-button--medium c-button--slate"
                type="button">No, cancel</button>
              <button class="c-button c-button--medium"
                type="button">
                Yes, restart
              </button>
            </div>
        </dialog>
      </div>
    </div>
    </div>
  </main>
  <script src="./js/main.js"
    defer></script>
</body>

</html>
